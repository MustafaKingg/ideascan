<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idea Scan 3000 — Real Network Mode</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e17;color:#e8ecf5;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.bg span{position:fixed;bottom:-70px;opacity:.14;z-index:0;animation:floatUp linear infinite;pointer-events:none}
@keyframes floatUp{to{transform:translateY(-120vh) rotate(360deg)}}
.wrap{max-width:720px;margin:0 auto;padding:34px 18px 60px;position:relative;z-index:2}
.logo{text-align:center;font-size:56px;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(255,215,64,.5))}
@keyframes bob{50%{transform:translateY(-8px)}}
h1{text-align:center;font-size:clamp(2rem,7vw,3.1rem);letter-spacing:3px;font-weight:900;
background:linear-gradient(90deg,#69f0ae,#40c4ff,#b388ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{text-align:center;color:#8fa1c4;margin-top:8px;font-size:.95rem}
.counter{text-align:center;margin:14px 0 22px;color:#7285a8;font-size:.85rem}
.counter b{color:#69f0ae}
.card{background:#141a2a;border:1px solid #232c42;border-radius:18px;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
label{font-weight:700;color:#c6d2ea}
textarea,input{width:100%;margin-top:10px;background:#0d1220;border:1px solid #2a3552;border-radius:12px;
color:#e8ecf5;font-size:16px;padding:13px;font-family:inherit}
textarea{min-height:96px;resize:vertical}
textarea:focus,input:focus{outline:2px solid #40c4ff;border-color:transparent}
textarea.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
button.main{width:100%;margin-top:16px;padding:16px;border:none;border-radius:14px;cursor:pointer;font-weight:900;
font-size:1.05rem;letter-spacing:1px;background:linear-gradient(90deg,#00e676,#00b0ff);color:#041018;transition:.15s}
button.main:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(0,230,118,.35)}
button.main:disabled{opacity:.5;cursor:wait;transform:none}
.scanbox{margin-top:20px}
.radar{position:relative;width:84px;height:84px;margin:0 auto 12px;border-radius:50%;border:2px solid #2a3552;
background:radial-gradient(circle,rgba(105,240,174,.18),transparent 70%)}
.radar::after{content:"";position:absolute;inset:0;border-radius:50%;
background:conic-gradient(from 0deg,transparent 0 72%,rgba(105,240,174,.9) 100%);animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.scanline{text-align:center;color:#9fb0d0;min-height:1.5em;font-size:.95rem}
.bar{height:10px;background:#0d1220;border:1px solid #2a3552;border-radius:99px;overflow:hidden;margin-top:12px}
#barFill{height:100%;width:0;background:linear-gradient(90deg,#69f0ae,#40c4ff)}
.hidden{display:none}
#result{margin-top:22px}
.result{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.verdict{font-size:2rem;font-weight:900;letter-spacing:1px}
.copied{border-color:#5a2430;box-shadow:0 0 44px rgba(255,82,82,.14);animation:pop .5s,shake .5s .15s}
.copied .verdict{color:#ff5252}
.original{border-color:#1d4d33;box-shadow:0 0 44px rgba(105,240,174,.15)}
.original .verdict{color:#69f0ae}
.big{margin-top:10px;font-size:1.15rem;line-height:1.6}
.big b{color:#ffd740}
.idea-echo{color:#8fa1c4;font-style:italic;margin:10px 0 14px;overflow-wrap:anywhere}
.who-box{background:#0d1220;border:1px dashed #35406b;border-radius:12px;padding:16px;text-align:center;color:#9fb0d0}
.who-box b{display:block;font-size:1.3rem;color:#ffd740;margin:6px 0}
.who-box a{color:#40c4ff}
.note{margin-top:14px;color:#c6d2ea;line-height:1.5}
.stamp{display:inline-block;border:3px double #69f0ae;color:#69f0ae;padding:8px 16px;border-radius:8px;
transform:rotate(-5deg);font-weight:900;letter-spacing:2px;margin-top:14px}
button.again{margin-top:18px;width:100%;padding:13px;border-radius:12px;border:1px solid #35406b;background:#0d1220;
color:#c6d2ea;font-weight:700;cursor:pointer}
button.again:hover{border-color:#40c4ff;color:#fff}
#recentCard{margin-top:22px}
#recentList{list-style:none}
#recentList li{padding:8px 4px;border-bottom:1px solid #232c42;color:#9fb0d0;font-size:.9rem;overflow-wrap:anywhere}
#recentList li:last-child{border-bottom:none}
h3{color:#c6d2ea;margin-bottom:10px}
footer{margin-top:30px;color:#7285a8;font-size:.8rem;text-align:center;line-height:1.7}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style></head>
<body>
<div class="bg" id="bg"></div>
<main class="wrap">
  <div class="logo">💡</div>
  <h1>IDEA SCAN 3000</h1>
  <p class="tag">Real-time idea registry + world knowledge check 🌍</p>
  <p class="counter" id="stats">Loading registry…</p>

  <section class="card">
    <label for="idea">Type your business idea:</label>
    <textarea id="idea" placeholder="e.g. Uber, but for hamsters 🐹"></textarea>
    <label for="name">Your name (to claim first-timer status):</label>
    <input id="name" placeholder="Anonymous" maxlength="40">
    <button class="main" id="scanBtn">🔍 SCAN MY IDEA</button>
    <div class="scanbox hidden" id="scanBox">
      <div class="radar"></div>
      <div class="scanline" id="scanLine"></div>
      <div class="bar"><div id="barFill"></div></div>
    </div>
  </section>

  <section id="result" class="hidden"></section>

  <section class="card hidden" id="recentCard">
    <h3>🥇 Recently claimed ideas</h3>
    <ul id="recentList"></ul>
  </section>

  <footer>Registry + Wikipedia check. Ideas can't be owned — execution is what counts. Best of luck! 🍀</footer>
</main>

<script>
const $=s=>document.querySelector(s), sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const trunc=s=>s.length>140?s.slice(0,140)+'…':s;
const fmtYear=y=>y<0?`~${-y} BC`:y;
const ago=t=>{const s=(Date.now()-t)/1e3;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';};

const LINES=["Checking the Idea Registry…","Comparing word fingerprints…","Searching Wikipedia (the world's brain)…","Looking for prior art…","Notarizing verdict…"];

async function loadStats(){ try{ const s=await (await fetch('/api/stats')).json();
  $('#stats').innerHTML=`🌍 <b>${s.registered}</b> ideas claimed by users · <b>${s.checks}</b> total checks`;}catch(e){} }
async function loadRecent(){ try{ const r=await (await fetch('/api/recent')).json();
  $('#recentCard').classList.toggle('hidden',!r.length);
  $('#recentList').innerHTML=r.map(x=>`<li>🥇 <b>${esc(x.name)}</b> claimed “${esc(x.idea)}” · ${ago(x.time)}</li>`).join('');}catch(e){} }

function confetti(){ const c=['#ff5252','#ffd740','#69f0ae','#40c4ff','#ff4081','#b388ff'];
  for(let i=0;i<120;i++){ const p=document.createElement('i'); p.className='confetti';
    p.style.left=Math.random()*100+'vw'; p.style.background=c[i%c.length];
    p.style.animationDuration=(2+Math.random()*2)+'s'; p.style.animationDelay=(Math.random()*.8)+'s';
    document.body.appendChild(p); setTimeout(()=>p.remove(),5200);} }
const focusIdea=()=>{ $('#idea').focus(); $('#idea').scrollIntoView({behavior:'smooth',block:'center'}); };

function show(r,idea){
  const box=$('#result'); box.classList.remove('hidden');
  const echo=`<p class="idea-echo">“${esc(trunc(idea))}”</p>`;
  if(!r.copied){
    box.innerHTML=`<div class="card result original"><div class="verdict">🎉 CONGRATULATIONS!</div>
      <p class="big">Your idea is the <b>FIRST!</b><br>You are good to go.. <b>Best of Luck</b> 🍀</p>${echo}
      <p class="note">🥇 Registered to <b>${esc(r.savedAs)}</b> as claim #${r.position} on this site. You're on the record!</p>
      <div class="stamp">CERTIFIED ORIGINAL™</div>
      <button class="again" onclick="focusIdea()">🚀 Scan another idea</button></div>`;
    confetti();
  }else if(r.source==='world'){
    box.innerHTML=`<div class="card result copied"><div class="verdict">🌍 ALREADY EXISTS IN THE REAL WORLD!</div>${echo}
      <div class="who-box"><span>The world already built this — see</span>
      <b><a href="${r.url}" target="_blank">${esc(r.who)}</a></b><span>Wikipedia</span></div>
      <p class="note">📜 ${esc(r.note)}</p>
      <button class="again" onclick="focusIdea()">😅 Okay… another idea</button></div>`;
  }else if(r.source==='history'){
    box.innerHTML=`<div class="card result copied"><div class="verdict">🚨 COPIED!</div>${echo}
      <div class="who-box"><span>First invented by</span><b>${esc(r.who)}</b>
      <span>${fmtYear(r.year)} · match score ${r.score}%</span></div>
      <p class="note">📜 ${esc(r.note)}</p>
      <button class="again" onclick="focusIdea()">😅 Okay… another idea</button></div>`;
  }else{
    box.innerHTML=`<div class="card result copied"><div class="verdict">🚨 CLAIMED BEFORE YOU!</div>${echo}
      <div class="who-box"><span>First registered on this site by</span><b>${esc(r.who)}</b>
      <span>${new Date(r.time).toLocaleString()} · similarity ${r.score}%</span></div>
      <p class="note">Their claim: “${esc(r.match)}”</p>
      <button class="again" onclick="focusIdea()">😅 Okay… another idea</button></div>`;
  }
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}

$('#scanBtn').onclick=async()=>{
  const idea=$('#idea').value.trim();
  if(!idea){ const t=$('#idea'); t.classList.add('shake'); setTimeout(()=>t.classList.remove('shake'),450); return; }
  const btn=$('#scanBtn'); btn.disabled=true; $('#result').classList.add('hidden');
  $('#scanBox').classList.remove('hidden');
  const fill=$('#barFill'); fill.style.transition='none'; fill.style.width='0';
  requestAnimationFrame(()=>{fill.style.transition='width 2600ms linear'; fill.style.width='100%';});
  const anim=(async()=>{ for(const l of LINES){ $('#scanLine').textContent=l; await sleep(520);} })();
  let r;
  try{
    r=await (await fetch('/api/check',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({idea, name:$('#name').value.trim()})})).json();
  }catch(e){
    await anim; $('#scanBox').classList.add('hidden'); btn.disabled=false;
    $('#result').classList.remove('hidden');
    $('#result').innerHTML=`<div class="card result copied"><div class="verdict">⚠️ SERVER NOT RUNNING</div>
      <p class="note">Run <b>node server.js</b> first, then open <b>http://localhost:3000</b></p></div>`;
    return;
  }
  await anim; await sleep(200);
  $('#scanBox').classList.add('hidden'); btn.disabled=false;
  show(r,idea); loadStats(); loadRecent();
};
$('#idea').addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)) $('#scanBtn').click(); });

const EMO=['💡','','🧠','💸','🦄','📈','⚡','🔥'];
for(let i=0;i<14;i++){ const s=document.createElement('span'); s.textContent=EMO[i%EMO.length];
  s.style.left=Math.random()*100+'vw'; s.style.fontSize=(16+Math.random()*22)+'px';
  s.style.animationDuration=(14+Math.random()*18)+'s'; s.style.animationDelay=(-Math.random()*20)+'s';
  $('#bg').appendChild(s); }
loadStats(); loadRecent();
</script>
</body></html>
